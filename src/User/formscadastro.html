<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/style.css" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
</head>

<body class="backgrond-black">
  <div class="container-cadastro container p-5">
    <form
      class="form-vermelho-cadastro"
      onsubmit="event.preventDefault(); registerUser();"
    >
      <div class="title">
        <h1>CADASTRO</h1>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">E-mail:</label>
        <input
          type="email"
          id="email"
          name="email_cadastro"
          placeholder="Digite seu e-mail:"
          class="form-control form-control-lg"
          required
        />
      </div>

      <div class="mb-3">
        <label for="name" class="form-label">Nome:</label>
        <input
          type="text"
          id="nome"
          name="nome_usuario"
          placeholder="Digite seu nome"
          class="form-control form-control-lg"
          required
        />
      </div>

      <div class="mb-3">
        <label for="cpf" class="form-label">CPF:</label>
        <input
          type="text"
          id="cpf"
          name="cpf"
          placeholder="Digite seu CPF"
          class="form-control form-control-lg"
          required
        />
      </div>

      <div class="mb-3">
        <label for="ddd" class="form-label">DDD:</label>
        <input
          type="number"
          id="ddd"
          name="ddd"
          class="form-control form-control-sm"
          placeholder="Digite seu DDD:"
          required
        />
      </div>

      <div class="mb-3">
        <label for="telefone" class="form-label">Número de Telefone:</label>
        <input
          type="number"
          id="telefone"
          name="numero"
          placeholder="Digite seu número:"
          class="form-control form-control-lg"
          required
        />
      </div>

      <div class="mb-3">
        <label for="senha" class="form-label">Senha:</label>
        <input
          type="password"
          id="senha"
          name="senha_usuario"
          placeholder="Digite sua senha:"
          class="form-control"
          required
        />
      </div>

      <div class="mb-3">
        <label for="repetir_senha">Repita a senha:</label>
        <input
          type="password"
          id="repetir_senha"
          name="senha_usario"
          placeholder="Repita sua senha:"
          class="form-control"
          required
        />
      </div>

      <div class="mb-3">
        <label for="endereco" class="form-label">Endereço:</label>
        <input
          type="text"
          id="endereco"
          name="endereco"
          placeholder="Digite seu endereço:"
          class="form-control form-control-lg"
          required
        />
      </div>

      <div class="mb-3">
        <label for="numero_casa" class="form-label">Número da casa:</label>
        <input
          type="number"
          id="numero_casa"
          name="numero_casa"
          placeholder="Digite o número da casa:"
          class="form-control form-control-lg"
          required
        />
      </div>

      <div class="mb-3">
        <label for="complemento" class="form-label">Complemento:</label>
        <input
          type="text"
          id="complemento"
          name="complemento"
          placeholder="Digite o complemento:"
          class="form-control form-control-lg"
          required
        />
      </div>

      <div class="mb-3">
        <label for="bairro" class="form-label">Bairro:</label>
        <input
          type="text"
          id="bairro"
          name="bairro"
          placeholder="Digite seu bairro:"
          class="form-control form-control-lg"
          required
        />
      </div>

      <div class="mb-3">
        <label for="cidade" class="form-label">Cidade:</label>
        <input
          type="text"
          id="cidade"
          name="cidade"
          placeholder="Digite sua cidade:"
          class="form-control form-control-lg"
          required
        />
      </div>

      <div class="mb-3">
        <label for="estado" class="form-label">Estado:</label>
        <input
          type="text"
          id="estado"
          name="estado"
          placeholder="Digite seu estado:"
          class="form-control form-control-lg"
          required
        />
      </div>
      
      <div class="mb-3">
        <label for="tipo_endereco" class="form-label">Tipo Endereço:</label>
        <input
          type="text"
          id="tipo_endereco"
          name="tipo_endereco"
          placeholder="Casa:"
          class="form-control form-control-lg"
          required
        />
      </div>

      <div class="mb-3">
        <label for="cep" class="form-label">CEP:</label>
        <input
          type="text"
          id="cep"
          name="cep"
          placeholder="Digite seu CEP:"
          class="form-control form-control-lg"
          required
        />
      </div>

      <div class="mb-3">
        <label for="data_nascimento" class="form-label">Data de nascimento:</label>
        <input
          type="date"
          id="data_nascimento"
          name="data_nascimento"
          class="form-control form-control-lg"
          required
        />
      </div>

      <div class="center-button">
        <button type="submit" class="button-black btn-submit">Cadastrar</button>
      </div>
    </form>
  </div>

  <script>
   async function registerUser() {
  const senha = document.getElementById('senha').value;
  const repetirSenha = document.getElementById('repetir_senha').value;

  if (senha !== repetirSenha) {
    alert("As senhas não coincidem.");
    return;
  }

  if (senha.length < 8) {
    alert("A senha deve ter no mínimo 8 caracteres.");
    return;
  }

  const userData = {
    nome: document.getElementById('nome').value,
    cpf: document.getElementById('cpf').value,
    email: document.getElementById('email').value,
    senha: senha,
    ddd: document.getElementById('ddd').value,
    telefone: document.getElementById('telefone').value,
    endereco: document.getElementById('endereco').value,
    numero_casa: document.getElementById('numero_casa').value,
    complemento: document.getElementById('complemento').value,
    tipo_endereco: document.getElementById('tipo_endereco').value,
    bairro: document.getElementById('bairro').value,
    cidade: document.getElementById('cidade').value,
    estado: document.getElementById('estado').value,
    cep: document.getElementById('cep').value,
    data_nascimento: document.getElementById('data_nascimento').value
  };

  try {
    const response = await fetch('http://localhost:3000/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(userData)
    });

    const result = await response.json();
    alert(result.message);
    window.location.href = 'index.html';
  } catch (error) {
    console.error('Erro ao registrar usuário:', error);
    alert('Erro ao registrar usuário.');
  }
}

  
  </script>

  <!-- Bootstrap JS -->
  <script src="JAVASCRIPT/jquery.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
    integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
    crossorigin="anonymous"
  ></script>
</body>
</html>
