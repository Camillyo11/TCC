<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="css/bootstrap.css" rel="stylesheet">
   
    <title>Login</title>
</head>
<body>
    <div class="container p-5">
    <form class="form-vermelho">
        <div class="mb-3">
            <div class="title">
                <h1>Acesse sua conta</h1>
            </div>
        
        <label for="email" class="form-label">Digite seu email:</label>
        <input type="email"  name="email_usuario" placeholder="Digite seu email" id="email" class="form-control" required> 
        </div>

    <div class="mb-3">
        <label for="password" class="">Digite sua senha:</label>
        <input type="password" name="senha_usuario" placeholder="Digite sua senha" id="senha" class="form-control" required>
    </div>

    <div class="link-recuperar-senha">
        <a href="#">esqueci minha senha</a>
    </div>

     
    <div class="center-button">
        <button  type="submit" class="button-black btn-submit">Conectar</button>
    </div>

    <div class="form-container">
        <div class="divider">
            <span>ou</span>
        </div>
        <p>Ainda não tem cadastro?</p>
        
        <div class="center-button">
            <button  type="submit" class="button-black btn-submit">Quero me cadastrar</button>
        </div>
      
    </div>

    </form>
</div>

    
</body>
</html>
